<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartable OS</title>
<link rel="stylesheet" href="os.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Cartable OS</span>
      <button class="chip-btn crumb" id="btnHome" type="button" hidden aria-label="Retour à l'accueil de Cartable OS"><span class="ico" data-ico="back"></span><span>Accueil</span></button>
      <span class="crumb-here" id="crumbHere" hidden>Mes Devoirs</span>
    </div>
    <div class="bar-right">
      <button class="chip-btn" id="openSettings" type="button" aria-label="Réglages"><span class="ico" data-ico="gear"></span><span>Réglages</span></button>
      <div class="win-btns" id="winBtns">
        <button class="win-btn" id="btnMin" type="button" aria-label="Réduire" title="Réduire"><span class="ico" data-ico="min"></span></button>
        <button class="win-btn" id="btnHide" type="button" aria-label="Ranger dans la zone de notification" title="Ranger dans la zone de notification"><span class="ico" data-ico="close"></span></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="home" aria-label="Accueil">
      <div class="clock-block">
        <div class="clock" id="clock" aria-live="off">--:--</div>
        <div class="date" id="date"></div>
      </div>

      <div class="now" id="nowBlock"></div>
      <div class="day" id="dayBlock"></div>

      <div class="apps-head"><h2>Applications</h2></div>
      <div class="apps" id="apps" role="list"></div>
    </section>

    <aside class="devoirs" id="devoirsPanel" aria-label="Mes Devoirs">
      <div class="dv-head">
        <h2>Mes Devoirs</h2>
        <button class="btn btn-soft" id="dvOpen" type="button">Ouvrir</button>
      </div>
      <div class="dv-body" id="dvBody"></div>
    </aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Réglages" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <h2>Réglages</h2>
    <button class="win-btn" id="closeSettings" type="button" aria-label="Fermer les réglages"><span class="ico" data-ico="close"></span></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" hidden></div>
<script src="os.js"></script>
</body>
</html>
