<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Devoirs · widget</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <header class="bar">
    <span class="bar-title">📚 Mes Devoirs</span>
    <div class="bar-btns">
      <button type="button" id="wNew" title="Nouveau devoir" aria-label="Nouveau devoir">＋</button>
      <button type="button" id="wPin" title="Toujours au premier plan" aria-label="Toujours au premier plan" aria-pressed="true">📌</button>
      <button type="button" id="wOpen" title="Ouvrir Mes Devoirs" aria-label="Ouvrir Mes Devoirs">↗</button>
      <button type="button" id="wClose" title="Fermer le widget" aria-label="Fermer le widget">✕</button>
    </div>
  </header>
  <main id="wBody" class="body"></main>
  <script src="i18n.js"></script>
  <script src="widget.js"></script>
</body>
</html>
