name: Publier le site (GitHub Pages)

# Le site est le dossier « site » du dépôt.
# Ne démarre jamais tout seul : onglet « Actions » → « Publier le site (GitHub Pages) » → « Run workflow ».
# À faire une seule fois : Settings → Pages → Source : « GitHub Actions ».
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publier sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le dossier du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
