name: Construire Mes Devoirs (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire x64, x86 (32 bits) et ARM64
        run: npx electron-builder --win --x64 --ia32 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Envoyer les fichiers (x64)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-x64
          path: dist/*-x64.exe

      - name: Envoyer les fichiers (x86 / 32 bits)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-x86-32bits
          path: dist/*-ia32.exe

      - name: Envoyer les fichiers (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-ARM64
          path: dist/*-arm64.exe

      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" dist/*.exe \
            --title "Mes Devoirs $VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --repo "$GITHUB_REPOSITORY"
