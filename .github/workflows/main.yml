name: Construire Mes Devoirs (Windows)

# Ne démarre plus tout seul quand tu ajoutes des fichiers au dépôt :
# onglet « Actions » → « Construire Mes Devoirs (Windows) » → « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version, ex : 1.2.0 (vide = 1.0.<numéro du run>). Chiffres uniquement : x.y.z"
        required: false
        default: ""
        type: string
      notes:
        description: "Description de la version, affichée dans l'appli avant l'installation (\\n = nouvelle ligne, « - » = liste). Vide = générée automatiquement par GitHub"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  # Calcule le numéro de version une seule fois pour tous les jobs (.msi, tag et release)
  version:
    name: Choisir la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer la version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
          RAW="${RAW#v}"
          if [ -n "$RAW" ]; then
            if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error title=Version invalide::« $INPUT_VERSION » n'est pas au format x.y.z (ex : 1.2.0)."
              exit 1
            fi
            VERSION="$RAW"
            echo "Version choisie : $VERSION"
          else
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            VERSION="$BASE.${{ github.run_number }}"
            echo "Version automatique : $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Un travail par architecture : si l'une échoue, les autres continuent
  # et on voit tout de suite laquelle pose problème.
  build:
    name: .msi ${{ matrix.label }}
    needs: version
    # windows-2022 : environnement stable pour les outils WiX utilisés pour les .msi
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: x64
            artifact: MesDevoirs-x64
          - arch: ia32
            label: x86 (32 bits)
            artifact: MesDevoirs-x86-32bits
          - arch: arm64
            label: ARM64
            artifact: MesDevoirs-ARM64
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # La version vient du job « Choisir la version » : même numéro pour le .msi, les fichiers et le tag
      - name: Appliquer la version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          echo "Version : $VERSION"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire le .msi (${{ matrix.label }})
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          if ! npx electron-builder --win msi --${{ matrix.arch }} --publish never 2>&1 | tee build.log; then
            # Affiche la vraie raison de l'échec dans le résumé du run (pas seulement « exit code 1 »)
            MSG=$(tail -n 25 build.log | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Échec du build ${{ matrix.label }}::$MSG"
            exit 1
          fi

      - name: Garder le journal du build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ matrix.arch }}
          path: build.log

      - name: Envoyer le .msi (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Publier la release
    needs: [version, build]
    # Publie même si une architecture a échoué, tant qu'au moins un .msi existe
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Télécharger les .msi
        uses: actions/download-artifact@v4
        with:
          pattern: MesDevoirs-*
          path: dist
          merge-multiple: true

      - name: Publier la release (nouveau tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          TAG="v$VERSION"
          NOTES="$(printf '%b' "$INPUT_NOTES")"
          ls -la dist
          if ! ls dist/*.msi > /dev/null 2>&1; then
            echo "::error::Aucun .msi à publier : tous les builds ont échoué."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Cas d'un « Re-run » : le tag existe déjà, on remplace juste les fichiers
            gh release upload "$TAG" dist/*.msi --clobber --repo "$GITHUB_REPOSITORY"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
          else
            if [ -n "$NOTES" ]; then
              NOTES_ARGS=(--notes "$NOTES")
            else
              NOTES_ARGS=(--generate-notes)
            fi
            gh release create "$TAG" dist/*.msi \
              "${NOTES_ARGS[@]}" \
              --title "Mes Devoirs $VERSION" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
