name: Construire Mes Devoirs (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire x64, x86 (32 bits) et ARM64
        run: npx electron-builder --win --x64 --ia32 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Envoyer les fichiers (x64)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-x64
          path: dist/*-x64.exe

      - name: Envoyer les fichiers (x86 / 32 bits)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-x86-32bits
          path: dist/*-ia32.exe

      - name: Envoyer les fichiers (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: MesDevoirs-ARM64
          path: dist/*-arm64.exe

      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Mes Devoirs ${{ steps.version.outputs.version }}
          files: dist/*.exe
          make_latest: 'true'
