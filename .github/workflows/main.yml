name: Construire Mes Devoirs (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  # Un travail par architecture : si l'une échoue, les autres continuent
  # et on voit tout de suite laquelle pose problème.
  build:
    name: .msi ${{ matrix.label }}
    # windows-2022 : environnement stable pour les outils WiX utilisés pour les .msi
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: x64
            artifact: MesDevoirs-x64
          - arch: ia32
            label: x86 (32 bits)
            artifact: MesDevoirs-x86-32bits
          - arch: arm64
            label: ARM64
            artifact: MesDevoirs-ARM64
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chaque publication reçoit un nouveau numéro : 1.0.<numéro du run>
      # Le même numéro sert pour le .msi, le nom des fichiers et le tag de la release.
      - name: Calculer la version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          echo "Version : $VERSION"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire le .msi (${{ matrix.label }})
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          if ! npx electron-builder --win msi --${{ matrix.arch }} --publish never 2>&1 | tee build.log; then
            # Affiche la vraie raison de l'échec dans le résumé du run (pas seulement « exit code 1 »)
            MSG=$(tail -n 25 build.log | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Échec du build ${{ matrix.label }}::$MSG"
            exit 1
          fi

      - name: Garder le journal du build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ matrix.arch }}
          path: build.log

      - name: Envoyer le .msi (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Publier la release
    needs: build
    # Publie même si une architecture a échoué, tant qu'au moins un .msi existe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Télécharger les .msi
        uses: actions/download-artifact@v4
        with:
          pattern: MesDevoirs-*
          path: dist
          merge-multiple: true

      - name: Publier la release (nouveau tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          TAG="v$VERSION"
          ls -la dist
          if ! ls dist/*.msi > /dev/null 2>&1; then
            echo "::error::Aucun .msi à publier : tous les builds ont échoué."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Cas d'un « Re-run » : le tag existe déjà, on remplace juste les fichiers
            gh release upload "$TAG" dist/*.msi --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.msi \
              --title "Mes Devoirs $VERSION" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
